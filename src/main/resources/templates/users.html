<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"> 🚌 Cloud Bus Pass System </a>
    </div>
</nav>

    <div class="container mt-5">
        <h2 class="mb-4">Registered Users</h2>

        <div class="card bg-primary text-white mb-3">
            <div class="card-body text-center">
                <h5>Total Registered Users</h5>
                <h2 th:text="${users.size()}"></h2>
            </div>
        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>
                    <td>
                        <a th:if="${user.role != 'ADMIN'}"
                           th:href="@{/deleteUser/{id}(id=${user.id})}"
                           class="btn btn-outline-danger mx-2 btn-sm">
                            <i class="bi bi-trash"></i>
                            Delete
                            </a>
                        <a th:href="@{/editUser/{id}{id=${user.id}}}" class="btn btn-outline-primary mx-2 btn-sm"> Edit </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
