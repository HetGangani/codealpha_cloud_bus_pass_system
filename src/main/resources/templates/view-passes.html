<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport content=width=device-width, initial-scale=1.0"></meta>
    <title>Buss Pass Applications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/view-passes"> 🚌 Cloud Bus Pass System </a>
            <div>
                <a href="/view-passes" class="btn btn-outline-light me-2"><i class="bi bi-speedometer2"></i> Dashboard </a>
                <a href="/users" class="btn btn-outline-light me-2"><i class="bi bi-people"> Users </i></a>
                <a href="/routes" class="btn btn-outline-light me-2"><i class="bi bi-bus-front"></i> Manage Routes </a>
                <a href="/logout" class="btn btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout </a>
            </div>
        </div>
    </nav>

    <div class="contanier-fluid mt-2">
        <h2 class="text-start my-2"> Welcome, Admin </h2>
    </div>

    <div class="container mt-5">
        <h3 class="mb-4"> Admin Dashboard </h3>
        <form action="/view-passes" method="GET" class="row-mb-4">
            <div class="col-mmd-4">
                <input type="text" class="form-control" name="keyword" placeholder="Search by Enrollment No." th:value="${keyword}">
            </div>
            <div class="d-grip gap-2 d-md-block mt-2 mb-2">
                <button class="btn btn-outline-primary"> Search </button>
                <a href="/view-passes" class="btn btn-outline-secondary"> Reset </a>
            </div>
        </form>
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white text-center shadow" style="border: 15px; transition: 0.3s; ">
                    <div class="card-body">
                        <h5> Total Applications </h5>
                        <h2 th:text="${totalPasses}"></h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-warning text-white text-center shadow">
                    <div class="card-body">
                        <h5>Pending</h5>
                        <h2 th:text="${pendingCount}"></h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-success text-white text-center shadow">
                    <div class="card-body">
                        <h5>Approved</h5>
                        <h2 th:text="${approvedCount}"></h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-danger text-white text-center shadow">
                    <div class="card-body">
                        <h5>Rejected</h5>
                        <h2 th:text="${rejectedCount}"></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4 shadow">
            <div class="card-header bg-dark text-white">
                Application Statistics
            </div>

            <div class="card-body" style="width: 300px; height: 300px; margin: auto;">
                <canvas id="statusChart"></canvas>
            </div>
        </div>

        <table class="table table-bordered table-hover table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Enrollment No</th>
                <th>Route</th>
                <th>Fare</th>
                <th>Status</th>
                <th>Applied On</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pass : ${passes}">
                <td th:text="${pass.id}"></td>
                <td th:text="${pass.studentName}"></td>
                <td th:text="${pass.enrollmentNo}"></td>
                <td th:text="${pass.routeName}"></td>
                <td th:text="${pass.fare}"></td>

                <td>
                    <span th:if="${pass.status == 'Pending'}" class="badge bg-warning"> Pending </span>
                    <span th:if="${pass.status == 'Approved'}" class="badge bg-success"> Approved </span>
                    <span th:if="${pass.status == 'Rejected'}" class="badge bg-danger"> Rejected </span>
                </td>

                <td th:text="${#temporals.format(pass.appliedDate, 'dd-MM-yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/approve-pass/{id}(id=${pass.id})}" class="btn btn-outline-success btn-sm"> Approve </a>
                    <a th:href="@{/reject-pass/{id}(id=${pass.id})}" class="btn btn-outline-danger btn-sm"> Reject </a>
                    <a th:if="${pass.status == 'Approved' }"
                       th:href="@{/download-pass/{id}(id=${pass.id})}"
                       class="btn btn-outline-primary btn-sm"> Download Pass </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <input type="hidden" id="pendingCount" th:value="${pendingCount}">
    <input type="hidden" id="approvedCount" th:value="${approvedCount}">
    <input type="hidden" id="rejectedCount" th:value="${rejectedCount}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
