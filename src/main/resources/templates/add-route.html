<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Route</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand fw-bold" href="/view-passes"> 🚌 Cloud Bus Pass System </a>
      <div>
        <a href="/view-passes" class="btn btn-outline-light me-2"> Dashboard </a>
        <a href="/routes" class="btn btn-outline-light me-2"> Routes </a>
        <a href="/logout" class="btn btn-outline-danger"> Logout </a>

      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="card shadow">

      <div class="card-header bg-primary text-white">
        Add New Route
      </div>

      <div class="card-body">
        <form action="/add-route" method="post">

          <div class="mb-3">
            <label class="form-label"> Route Name </label>
            <input type="text" name="routeName" class="form-control" placeholder="Enter Route Name" required>
          </div>

          <div class="mb-3">
            <label class="form-label"> Source </label>
            <input type="text" name="source" class="form-control" placeholder="Enter Source" required>
          </div>

          <div class="mb-3">
            <label class="form-label"> Destination </label>
            <input type="text" name="destination" class="form-control" placeholder="Enter Destination" required>
          </div>

          <div class="mb-3">
            <label class="form-label"> Fare (₹) </label>
            <input type="number" step="0.01" name="fare" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-outline-success"> Save Route </button>
          <a href="/routes" class="btn btn-outline-secondary"> Back </a>

        </form>
      </div>
    </div>
  </div>
</body>
</html>
