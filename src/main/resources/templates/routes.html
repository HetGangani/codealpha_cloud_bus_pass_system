<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/view-passes"> 🚌 Cloud Bus Pass System </a>
            <div>
                <a href="/view-passes" class="btn btn-outline-light me-2"> Dashboard </a>
                <a href="/routes" class="btn btn-outline-light me-2"> Routes </a>
                <a href="/view-passes" class="btn btn-outline-light"> Admin Dashboard </a>
                <a href="/logout" class="btn btn-outline-danger"> Logout </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Route Management</h2>

        <a href="/add-route" class="btn btn-outline-primary mb-3"> Add Route </a>
        <table class="table table-bordered table-hover table-striped">
            <thead>
            <tr>
                <th>ID</th>
                <th>Route</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Fare</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="route : ${routes}">
                <td th:text="${route.id}"></td>
                <td th:text="${route.routeName}"></td>
                <td th:text="${route.source}"></td>
                <td th:text="${route.destination}"></td>
                <td th:text="${route.fare}"></td>

                <td>
                    <a th:href="@{/edit-route/{id}(id=${route.id})}" class="btn btn-outline-warning sm"> Edit </a>
                    <a th:href="@{/delete-route/{id}(id=${route.id})}" class="btn btn-outline-danger sm"
                        onclick="return confirm('Are you sure you want to delete this route?')"> Delete </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
