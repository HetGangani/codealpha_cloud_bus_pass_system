<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/student-dashboard"> 🚌 Cloud Bus Pass System </a>
            <div>
                <a href="/student-dashboard" class="btn btn-outline-light me-2"> Dashboard </a>
                <a href="/apply-pass" class="btn btn-outline-light me-2"> Apply Pass </a>
                <a href="/profile" class="btn btn-outline-light me-2"> Profile </a>
                <a href="/logout" class="btn btn-outline-danger"> Logout </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 900px;">
        <div class="card shadow">
            <div class="card-header bg-warning">
                Change Password
            </div>

            <div class="card-body">

                <div th:if="${param.error}" class="alert alert-danger">
                    Current password is incorrect.
                </div>

                <div th:if="${param.success}" class="alert alert-success">
                    Password changed successfully!!
                </div>
                <form action="/change-password" method="POST">
                    <div class="mb-3">
                        <label> Current Password </label>
                        <input type="password" name="currentPassword" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label> New Password </label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>

                    <button class="btn btn-outline-success"> Update Password </button>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
