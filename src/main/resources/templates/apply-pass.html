<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Buss Pass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="/student-dashboard"> 🚌 Cloud Bus Pass System </a>
            <div>
                <a href="/student-dashboard" class="btn btn-outline-light me-2"> Dashboard </a>
                <a href="/apply-pass" class="btn btn-outline-light me-2"> Apply Pass </a>
                <a href="/profile" class="btn btn-outline-light me-2"> Profile </a>
                <a href="/student-dashboard" class="btn btn-outline-light me-2"> Back To Dashboard </a>
                <a href="/logout" class="btn btn-outline-danger"> Logout </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 900px;">
        <h5>
            Welcome,
            <span th:text="${loggedInUser.fullName}"></span>
        </h5>
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3>Bus Pass Application</h3>
            </div>
            <div class="card-body">

                <script th:if="${successMessage}">
                    alert("Bus Pass Application Submitted Successfully!");
                </script>

                <script th:if="${errorMessage}">
                    alert("Error submitting application!");
                </script>

                <script th:if="${duplicateMessage}">
                    alert("Pass Application already exists!!");
                </script>

                <form action="/save-pass" method="post">
                    <div class="mb-3">
                        <label>Student Name</label>
                        <input type="text" class="form-control" name="studentName">
                    </div>

                    <div class="mb-3">
                        <label>Enrollment Number</label>
                        <input type="text" class="form-control" name="enrollmentNo">
                    </div>

                    <div class="mb-3">
                        <label>College Name</label>
                        <input type="text" class="form-control" name="collegeName">
                    </div>

                    <div class="mb-3">
                        <label class="form-label"> Select Route </label>
                        <select name="routeId" class="form-select" required>
                            <option value=""> Select Route </option>
                            <option th:each="route : ${routes}"
                                    th:value="${route.id}"
                                    th:text="${route.routeName + '(' + route.source + ' -> ' + route.destination + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Mobile Number</label>
                        <input type="text" class="form-control" name="mobileNumber">
                    </div>
                    <button class="btn btn-outline-success"> Apply Pass </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
