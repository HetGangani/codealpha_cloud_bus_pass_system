<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Edit User`  ex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"> 🚌 Cloud Bus Pass System </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow">

            <div class="card-header bg-warning">
                <h3>Edit User</h3>
            </div>

            <div class="card-body">
                <form action="/updateUser" method="post">
                    <input type="hidden" name="id" th:value="${user.id}">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" class="form-control" name="fullName" th:value="${user.fullName}">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" th:value="${user.email}">
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="text" class="form-control" name="password" th:value="${user.password}">
                    </div>
                    <button class="btn btn-outline-success">Update User</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
